spring.application.name=spring-chat-sample

spring-chat.title=Shop assistant
spring-chat.intro=Hello. Ask me about your orders.
spring-chat.placeholder=Ask about your orders
spring-chat.system-prompt="You are the assistant of a small online shop. Look up the signed-in user's orders with the tools and never guess one. Answer briefly, in the language of the question."

# The provider that answers, through Spring AI: anthropic, openai or gemini.
# Without the key of that one the application does not start.
spring.ai.model.chat=${CHAT_PROVIDER:anthropic}
# The chat is all the application uses of them, and an embedding model if it is asked
# for: with EMBEDDING_PROVIDER=openai the shop's help pages are embedded at the start
# (see HelpAutoConfiguration), and a reply can use them. Each kind of model has a switch
# of its own, and a kind that a new version of Spring AI adds is on until it gets one
# here: the decision model came with 2.1.
spring.ai.model.embedding=${EMBEDDING_PROVIDER:none}
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.model.decision=none

# A model named "fake" is a stand-in that the application starts itself, on this port.
# It needs no key. See FakeModelEnvironmentPostProcessor.
fake-model.port=18089

# A stopped reply can go on at the provider (see the README), so a reply has a ceiling.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
spring.ai.anthropic.chat.max-tokens=8192

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-6.1-terra}
spring.ai.openai.chat.max-completion-tokens=8192
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
# How close to the question a section of the help pages has to be, from 0 to 1.
shop.help.similarity-threshold=0.3

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.max-output-tokens=8192
