# The team's coding guidelines as an MCP server, see McpServerConfiguration. These are defaults:
# application.properties and the environment override them.

# Off unless agent.mcp.enabled=true. Spring AI's MCP server starter is on by default.
spring.ai.mcp.server.enabled=${agent.mcp.enabled:false}

# Stateless Streamable HTTP at POST /mcp: the guidelines need no session, and any
# Streamable HTTP client reaches it.
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=coding-guidelines
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=The team's coding guidelines: Java, testing and Git. No files and no commands.

# Only what McpServerConfiguration lists. Otherwise every ToolCallback and
# ToolCallbackProvider bean of the application would become a tool of the server, such
# as the coding tools, if they ever were one, and with no user whose workspace to read.
spring.ai.mcp.server.tool-callback-converter=false
spring.ai.mcp.server.expose-mcp-client-tools=false
# On a stateless server, Spring AI 2.1.0 drops the annotated methods too when the
# converter is off, so McpServerConfiguration makes their specifications itself. Scanning
# as well would serve them twice once that is fixed.
spring.ai.mcp.server.annotation-scanner.enabled=false
