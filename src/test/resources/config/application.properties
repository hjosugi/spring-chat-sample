# Read by every test that starts the whole application, on top of the application's own
# application.properties, so that those tests start the application as it ships. The
# packaged application never sees this file.
#
# The tests that verify Spring AI feature by feature put on the test classpath what the
# application does not have: Spring Boot's JDBC support with an embedded database, the
# JDBC stores of sessions and of the deprecated chat memory, PGvector, and Redis with the
# semantic cache, which would download an embedding model. The application has no
# database and no Redis, so they stay off when it starts. The JDBC session repository
# and PGvector step back by themselves without a DataSource or with the type below; the
# JDBC chat memory does not, and asks for a JdbcTemplate.
#
# The starters of the providers that only the tests have are kept out in another way,
# because no property turns them off: see models.TestOnlyStarters.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration
spring.ai.vectorstore.type=none
spring.ai.vectorstore.redis.semantic-cache.enabled=false
